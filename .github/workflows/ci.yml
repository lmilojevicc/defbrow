# CI runs the canonical checks from docs/usage.md on both Linux and macOS.
#
# The ubuntu-latest leg is the mandatory one: src/backend/linux.rs is
# #[cfg(target_os = "linux")] (and tests/linux_cli.rs is gated the same way), so
# none of that code is compiled on a macOS development machine. Linux-only build,
# lint and test breakage -- for example a signature change in the shared Backend
# trait that misses call sites inside the Linux module's tests -- therefore passes
# `cargo build` and the whole macOS test run locally while breaking `cargo test`
# on the platform the crate advertises support for.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both legs even when one fails; a Linux failure must not hide the
      # macOS result, or vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Python for release helpers
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Release helper regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --locked --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test --locked
        run: cargo test --locked
