# CI runs the canonical checks from docs/usage.md on both Linux and macOS.
#
# The ubuntu-latest leg is the mandatory one: src/backend/linux.rs is
# #[cfg(target_os = "linux")] (and tests/linux_cli.rs is gated the same way), so
# none of that code is compiled on a macOS development machine. Linux-only build,
# lint and test breakage -- for example a signature change in the shared Backend
# trait that misses call sites inside the Linux module's tests -- therefore passes
# `cargo build` and the whole macOS test run locally while breaking `cargo test`
# on the platform the crate advertises support for.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both legs even when one fails; a Linux failure must not hide the
      # macOS result, or vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Python for release helpers
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Release helper regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --locked --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test --locked
        run: cargo test --locked
