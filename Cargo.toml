[package]
name = "defbrow"
version = "0.1.0"
edition = "2021"
description = "A searchable default-browser picker for macOS and Linux"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSError", "NSObject", "NSRunLoop", "NSString", "NSURL"] }
block2 = "0.6.2"
